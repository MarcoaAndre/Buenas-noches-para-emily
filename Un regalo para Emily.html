<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un regalo para Emily</title>
<style>
:root{--bg:linear-gradient(160deg,#ffe3ef 0%,#e9e2ff 50%,#d6f5ec 100%);--ink:#5a4560;--card:#fff7cf;--hint:#e86aa0;--ribbon:#ff9ec4;--box:#b9e8d5;--lid:#ffd3b6;--heart:#ffb8d4;--floor:#f5c9e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:linear-gradient(160deg,#3a2a44 0%,#2d2b4d 50%,#25403f 100%);--ink:#fbeaf5;--card:#5b4a62;--hint:#ffa3c6;--floor:#4e3a5c}}
:root[data-theme="dark"]{--bg:linear-gradient(160deg,#3a2a44 0%,#2d2b4d 50%,#25403f 100%);--ink:#fbeaf5;--card:#5b4a62;--hint:#ffa3c6;--floor:#4e3a5c}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Chalkboard SE","Marker Felt",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cats{position:fixed;inset:0;z-index:0;pointer-events:none}
.sc{position:absolute;opacity:0;transform:scale(0) rotate(-40deg)}
.sc img,.pal img{display:block;width:100%;height:auto;transform-origin:50% 100%}
.open .sc{animation:pop2 .7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop2{to{opacity:1;transform:scale(1) rotate(0)}}
.open .sc img{animation:dance var(--d,1s) ease-in-out var(--dl,1.5s) infinite}
.stage{position:relative;z-index:1;width:min(360px,100%);height:560px}
.dot{position:absolute;border-radius:50%;opacity:.55}
.floor{position:absolute;left:12%;right:12%;bottom:0;height:24px;background:var(--floor);border-radius:50%}
.hint{position:absolute;top:40px;left:0;right:0;text-align:center;font-size:26px;line-height:1.2;padding:0 12px;font-weight:700;color:var(--hint);transition:opacity .4s}
.open .hint{opacity:0}
.box{position:absolute;left:50%;bottom:8px;width:230px;height:203px;margin-left:-115px;cursor:pointer;z-index:3;-webkit-tap-highlight-color:transparent;animation:wig 1.6s ease-in-out infinite}
.box svg{display:block;width:100%;height:100%}
.open .box{animation:none}
@keyframes wig{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(-5deg)}76%{transform:rotate(5deg)}84%{transform:rotate(-4deg)}92%{transform:rotate(3deg)}}
.lid{transform-origin:20px 50px;transition:transform .8s cubic-bezier(.3,1.4,.5,1),opacity .6s .3s}
.open .lid{transform:translate(90px,-170px) rotate(35deg);opacity:0}
.heartwrap{position:absolute;left:50%;bottom:185px;width:300px;height:280px;margin-left:-150px;z-index:1;opacity:0;transform:translateY(80px) scale(.2);transform-origin:50% 100%}
.open .heartwrap{animation:pop 1s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes pop{to{opacity:1;transform:translateY(0) scale(1)}}
.hbg{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 55%}
.open .hbg{animation:beat 1.2s ease-in-out 1.1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.pal{position:absolute;bottom:96px;width:92px}
.pal.l{left:30px}.pal.r{right:30px}
.open .pal img{animation:dance .9s ease-in-out 1.1s infinite}
.open .pal.r img{animation-delay:1.55s}
@keyframes dance{0%,100%{transform:rotate(-9deg) translateY(0)}25%{transform:rotate(0) translateY(-12px)}50%{transform:rotate(9deg) translateY(0)}75%{transform:rotate(0) translateY(-12px)}}
.say{position:absolute;top:6px;left:50%;width:250px;margin-left:-125px;padding:10px 8px 12px;background:var(--card);border:3px solid var(--ink);border-radius:22px;text-align:center;font-weight:700;line-height:1.2;opacity:0;transform:scale(.5);z-index:4}
.say::after{content:"";position:absolute;bottom:-13px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:11px solid var(--ink);border-bottom:0}
.say b{display:block;font-size:30px;color:var(--hint)}
.say span{display:block;font-size:22px}
.open .say{animation:bub .6s cubic-bezier(.3,1.6,.5,1) 1.2s forwards}
@keyframes bub{to{opacity:1;transform:scale(1)}}
.fh{position:absolute;bottom:200px;width:22px;height:22px;opacity:0;z-index:2;pointer-events:none}
.open .fh{animation:fl 3.4s ease-out infinite}
@keyframes fl{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translateY(-280px) scale(1.1)}}
</style>
</head>
<body class="">
<div class="cats" id="cats"></div>
<div class="stage" id="stage">
  <div class="dot" style="width:70px;height:70px;left:2%;top:14%;background:#ffe9a8"></div>
  <div class="dot" style="width:46px;height:46px;right:4%;top:30%;background:#c9f0e0"></div>
  <div class="dot" style="width:58px;height:58px;left:0;bottom:30%;background:#d9ccff"></div>
  <div class="dot" style="width:34px;height:34px;right:8%;bottom:34%;background:#ffd3b6"></div>

  <div class="hint">Toca para abrir tu regalo de buenas noches</div>
  <div class="floor"></div>
  <div class="say"><b>Te amo, Emily</b><span>Te extraño</span></div>

  <div class="heartwrap">
    <svg class="hbg" viewBox="0 0 300 280">
      <path d="M150 265C40 190 10 120 10 80C10 35 50 10 90 10C120 10 140 28 150 50C160 28 180 10 210 10C250 10 290 35 290 80C290 120 260 190 150 265Z" fill="var(--heart)" stroke="#5a4560" stroke-width="5" stroke-linejoin="round"/>
      <path d="M40 80C40 52 62 36 86 36" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".8"/>
      <circle cx="244" cy="70" r="6" fill="#fff" opacity=".7"/><circle cx="226" cy="104" r="4" fill="#fff" opacity=".7"/><circle cx="68" cy="130" r="4" fill="#fff" opacity=".7"/>
    </svg>
    <div class="pal l" id="pl"></div>
    <div class="pal r" id="pr"></div>
  </div>

  <div class="box" id="box" role="button" tabindex="0" aria-label="Abrir regalo">
    <svg viewBox="0 0 170 150" stroke="#5a4560" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <rect x="12" y="52" width="146" height="94" rx="8" fill="var(--box)"/>
      <rect x="72" y="52" width="26" height="94" fill="var(--ribbon)"/>
      <circle cx="40" cy="90" r="5" fill="#fff" stroke="none" opacity=".7"/><circle cx="132" cy="112" r="5" fill="#fff" stroke="none" opacity=".7"/><circle cx="46" cy="124" r="3.5" fill="#fff" stroke="none" opacity=".7"/>
      <g class="lid">
        <rect x="4" y="28" width="162" height="30" rx="8" fill="var(--lid)"/>
        <rect x="72" y="28" width="26" height="30" fill="var(--ribbon)"/>
        <path d="M85 28C60-2 38 14 56 26Z" fill="var(--ribbon)"/>
        <path d="M85 28C110-2 132 14 114 26Z" fill="var(--ribbon)"/>
        <circle cx="85" cy="28" r="7" fill="var(--ribbon)"/>
      </g>
    </svg>
  </div>
</div>
